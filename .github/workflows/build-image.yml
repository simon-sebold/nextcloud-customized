
name: Build and publish Nextcloud image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/build-image.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/simon-sebold/nextcloud-customized

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Nextcloud version from Dockerfile
        id: version
        shell: bash
        run: |
          VERSION=$(sed -nE \
            's/^FROM[[:space:]]+nextcloud:([0-9]+\.[0-9]+\.[0-9]+)-apache.*/\1/p' \
            Dockerfile | head -n 1)

          if [[ -z "$VERSION" ]]; then
            echo "ERROR: Could not extract Nextcloud version from Dockerfile."
            exit 1
          fi

          echo "Detected Nextcloud version: $VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/simon-sebold/nextcloud-customized
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
